<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1726" />
      <stop offset="50%" stop-color="#15233e" />
      <stop offset="100%" stop-color="#1b2a4a" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4e82ff" />
      <stop offset="100%" stop-color="#2457d6" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3269ed" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#3269ed" stop-opacity="0" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Ambient Glow Circles -->
  <circle cx="1050" cy="150" r="350" fill="url(#glow)" />
  <circle cx="150" cy="550" r="300" fill="url(#glow)" />

  <!-- Container Box / Card -->
  <rect x="80" y="70" width="1040" height="490" rx="24" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.1" filter="url(#shadow)" />

  <!-- Logo Mark -->
  <g transform="translate(140, 130)">
    <rect width="84" height="84" rx="20" fill="url(#brandGrad)" filter="url(#shadow)" />
    <!-- DocHub Icon Symbol -->
    <path d="M26 20h22l16 16v28H26V20Z" fill="#ffffff" fill-opacity="0.95"/>
    <path d="M38 34h12l8 8v12h-20V34Z" fill="#2457d6"/>
    <path d="M26 20h12v40h-12V20Z" fill="#8baeff"/>
  </g>

  <!-- Brand Name -->
  <text x="250" y="190" font-family="'Inter', -apple-system, sans-serif" font-size="52" font-weight="800" fill="#ffffff" letter-spacing="-1">
    DocHub<tspan fill="#4e82ff">.</tspan>
  </text>
  <text x="470" y="190" font-family="'Inter', -apple-system, sans-serif" font-size="20" font-weight="600" fill="#8baeff" letter-spacing="3">
    ENTERPRISE WORKSPACE
  </text>

  <!-- Main Headline -->
  <text x="140" y="295" font-family="'Inter', -apple-system, sans-serif" font-size="44" font-weight="750" fill="#ffffff" letter-spacing="-0.5">
    Hệ thống Quản lý Tài liệu &amp; Tri thức
  </text>
  <text x="140" y="355" font-family="'Inter', -apple-system, sans-serif" font-size="32" font-weight="400" fill="#c4d0e3">
    Phân quyền đa cấp · Đồng bộ Google Drive · Bảo mật Supabase RLS
  </text>

  <!-- Feature Pills -->
  <g transform="translate(140, 420)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="230" height="52" rx="26" fill="#ffffff" fill-opacity="0.08" stroke="#4e82ff" stroke-opacity="0.4" />
    <text x="115" y="32" font-family="'Inter', -apple-system, sans-serif" font-size="17" font-weight="600" fill="#edf3ff" text-anchor="middle">
      ✓ Cây thư mục đa cấp
    </text>

    <!-- Pill 2 -->
    <rect x="250" y="0" width="240" height="52" rx="26" fill="#ffffff" fill-opacity="0.08" stroke="#4e82ff" stroke-opacity="0.4" />
    <text x="370" y="32" font-family="'Inter', -apple-system, sans-serif" font-size="17" font-weight="600" fill="#edf3ff" text-anchor="middle">
      ✓ Tìm kiếm tiếng Việt
    </text>

    <!-- Pill 3 -->
    <rect x="510" y="0" width="230" height="52" rx="26" fill="#ffffff" fill-opacity="0.08" stroke="#4e82ff" stroke-opacity="0.4" />
    <text x="625" y="32" font-family="'Inter', -apple-system, sans-serif" font-size="17" font-weight="600" fill="#edf3ff" text-anchor="middle">
      ✓ Google Drive Sync
    </text>

    <!-- Pill 4 -->
    <rect x="760" y="0" width="160" height="52" rx="26" fill="#ffffff" fill-opacity="0.08" stroke="#4e82ff" stroke-opacity="0.4" />
    <text x="840" y="32" font-family="'Inter', -apple-system, sans-serif" font-size="17" font-weight="600" fill="#edf3ff" text-anchor="middle">
      ✓ Cloud RBAC
    </text>
  </g>

  <!-- Bottom URL -->
  <text x="1040" y="520" font-family="'Inter', -apple-system, sans-serif" font-size="18" font-weight="500" fill="#8baeff" text-anchor="end">
    dochub.nguyentronghuu.com
  </text>
</svg>
